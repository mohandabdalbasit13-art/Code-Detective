<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شفرة الكلمات - لعبة الحروف</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --accent: #f59e0b;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        header {
            text-align: center;
        }

        header h1 {
            color: var(--primary);
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        header p {
            font-size: 0.9rem;
            color: #6b7280;
        }

        /* المجموعات المرجعية */
        .reference-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            background: #eef2ff;
            padding: 12px;
            border-radius: 12px;
            transition: opacity 0.3s;
        }

        .group-card {
            background: white;
            padding: 6px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #c7d2fe;
        }

        .group-num {
            font-weight: bold;
            color: var(--primary);
            font-size: 0.85rem;
        }

        .group-letters {
            font-size: 0.8rem;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* اختيار المستوى */
        .level-selector {
            display: flex;
            background: #f3f4f6;
            padding: 4px;
            border-radius: 10px;
        }

        .level-btn {
            flex: 1;
            padding: 8px 0;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 8px;
            font-weight: bold;
            color: #6b7280;
            transition: 0.3s;
        }

        .level-btn.active {
            background: white;
            color: var(--primary);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* منطقة اللعبة */
        .game-card {
            border: 2px dashed #e5e7eb;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: bold;
            color: var(--accent);
        }

        .hint-badge {
            background: #fef3c7;
            color: #d97706;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: inline-block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .cipher-display {
            font-size: 1.8rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: var(--primary);
            margin: 10px 0;
            direction: ltr;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 1.1rem;
            text-align: center;
            direction: ltr;
            text-transform: uppercase;
            outline: none;
            transition: 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .audio-btn {
            background: #3b82f6;
            margin-top: 5px;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .feedback {
            margin-top: 10px;
            font-weight: bold;
            min-height: 28px;
            font-size: 1rem;
        }

        .translation-box {
            font-size: 1.1rem;
            color: var(--primary);
            font-weight: bold;
            margin-top: 5px;
            display: none;
        }

        /* قسم أداة التشفير التفاعلية */
        .encoder-section {
            background: #f9fafb;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
        }

        .encoder-section h3 {
            font-size: 0.95rem;
            margin-bottom: 8px;
        }

        .encoded-result {
            margin-top: 8px;
            font-weight: bold;
            color: var(--success);
            direction: ltr;
            text-align: center;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>🔍 شفرة الكلمات</h1>
        <p>Word Code: Alphabet Detective</p>
    </header>

    <!-- لوحة المجموعات المرجعية -->
    <div class="reference-board" id="referenceBoard">
        <div class="group-card"><div class="group-num">1</div><div class="group-letters">A B C D</div></div>
        <div class="group-card"><div class="group-num">2</div><div class="group-letters">E F G H</div></div>
        <div class="group-card"><div class="group-num">3</div><div class="group-letters">I J K L</div></div>
        <div class="group-card"><div class="group-num">4</div><div class="group-letters">M N O P</div></div>
        <div class="group-card"><div class="group-num">5</div><div class="group-letters">Q R S T</div></div>
        <div class="group-card"><div class="group-num">6</div><div class="group-letters">U V W X</div></div>
        <div class="group-card"><div class="group-num">7</div><div class="group-letters">Y Z</div></div>
    </div>

    <!-- اختيار المستوى -->
    <div class="level-selector">
        <button class="level-btn active" onclick="setLevel('kids')">أطفال 👶</button>
        <button class="level-btn" onclick="setLevel('medium')">ناشئة 👦</button>
        <button class="level-btn" onclick="setLevel('expert')">محترفون 🧠</button>
    </div>

    <!-- منطقة اللعبة -->
    <div class="game-card">
        <div class="score-board">
            <span>النقاط: <span id="score">0</span></span>
            <span id="levelLabel">المستوى: أطفال</span>
        </div>
        
        <!-- تلميح عدد الأحرف -->
        <div class="hint-badge" id="letterCountHint">الكلمة تتكون من: 3 أحرف</div>

        <div class="cipher-display" id="cipherText">4+1+4</div>
        <input type="text" id="userInput" placeholder="اكتب الكلمة بالإنجليزية..." autocomplete="off">
        <button class="btn" onclick="checkAnswer()">تحقق من الإجابة</button>
        
        <button class="btn audio-btn" id="listenBtn" onclick="speakWord(currentWord)">
            🔊 استمع للطق النطق الصحيح
        </button>

        <div class="feedback" id="feedback"></div>
        <div class="translation-box" id="translationBox"></div>
    </div>

    <!-- أداة تشفير سريعة -->
    <div class="encoder-section">
        <h3>⚡ أداة تشفير وتجربة أي كلمة:</h3>
        <input type="text" id="encoderInput" placeholder="اكتب كلمة للتشفير..." oninput="encodeCustomWord()">
        <div class="encoded-result" id="encoderResult">---</div>
    </div>
</div>

<script>
    // توزيع الحروف المرجعية
    const letterGroups = {
        'A':1, 'B':1, 'C':1, 'D':1,
        'E':2, 'F':2, 'G':2, 'H':2,
        'I':3, 'J':3, 'K':3, 'L':3,
        'M':4, 'N':4, 'O':4, 'P':4,
        'Q':5, 'R':5, 'S':5, 'T':5,
        'U':6, 'V':6, 'W':6, 'X':6,
        'Y':7, 'Z':7
    };

    // بنك كلمات متكامل يضم أكثر من 120 كلمة مقسمة حسب المستويات مع ترجمتها العربية
    const wordBank = {
        kids: [
            { word: "CAT", ar: "قطة" }, { word: "DOG", ar: "كلب" }, { word: "BOY", ar: "ولد" },
            { word: "BED", ar: "سرير" }, { word: "MAN", ar: "رجل" }, { word: "PEN", ar: "قلم" },
            { word: "SUN", ar: "شمس" }, { word: "CUP", ar: "كوب" }, { word: "BOX", ar: "صندوق" },
            { word: "CAR", ar: "سيارة" }, { word: "HAT", ar: "قبعة" }, { word: "EGG", ar: "بيضة" },
            { word: "FAN", ar: "مروحة" }, { word: "BUS", ar: "حافلة" }, { word: "BAG", ar: "حقيبة" },
            { word: "KEY", ar: "مفتاح" }, { word: "MAP", ar: "خريطة" }, { word: "ARM", ar: "ذراع" },
            { word: "PIG", ar: "خنزير" }, { word: "FOX", ar: "ثعلب" }, { word: "RUN", ar: "يجري" },
            { word: "RED", ar: "أحمر" }, { word: "ONE", ar: "واحد" }, { word: "TWO", ar: "اثنان" },
            { word: "DAY", ar: "يوم" }, { word: "SKY", ar: "سماء" }, { word: "BAT", ar: "خفاش" },
            { word: "ANT", ar: "نملة" }, { word: "BEE", ar: "نحلة" }, { word: "COW", ar: "بقرة" },
            { word: "ICE", ar: "ثلج" }, { word: "SEA", ar: "بحر" }, { word: "TOY", ar: "لعبة" },
            { word: "EYE", ar: "عين" }, { word: "JAM", ar: "مربى" }, { word: "LIP", ar: "شفة" },
            { word: "NUT", ar: "مكسرات" }, { word: "PIN", ar: "دبوس" }, { word: "TOP", ar: "قمة" },
            { word: "ZOO", ar: "حديقة حيوان" }
        ],
        medium: [
            { word: "LION", ar: "أسد" }, { word: "MILK", ar: "حليب" }, { word: "FISH", ar: "سمكة" },
            { word: "HAND", ar: "يد" }, { word: "BOOK", ar: "كتاب" }, { word: "DOOR", ar: "باب" },
            { word: "MOON", ar: "قمر" }, { word: "STAR", ar: "نجمة" }, { word: "TREE", ar: "شجرة" },
            { word: "BIRD", ar: "طائر" }, { word: "GAME", ar: "لعبة" }, { word: "FOOD", ar: "طعام" },
            { word: "DESK", ar: "مكتب" }, { word: "KING", ar: "ملك" }, { word: "PARK", ar: "حديقة" },
            { word: "SHIP", ar: "سفينة" }, { word: "RING", ar: "خاتم" }, { word: "BALL", ar: "كرة" },
            { word: "CAKE", ar: "كعكة" }, { word: "FIRE", ar: "نار" }, { word: "HOME", ar: "منزل" },
            { word: "LAMP", ar: "مصباح" }, { word: "RAIN", ar: "مطر" }, { word: "SNOW", ar: "ثلج" },
            { word: "WIND", ar: "ريح" }, { word: "BABY", ar: "رضيع" }, { word: "CITY", ar: "مدينة" },
            { word: "DUCK", ar: "بطة" }, { word: "FROG", ar: "ضفدع" }, { word: "GOLD", ar: "ذهب" },
            { word: "LEAF", ar: "ورقة شجر" }, { word: "MOOD", ar: "مزاج" }, { word: "NAME", ar: "اسم" },
            { word: "ROAD", ar: "طريق" }, { word: "TIME", ar: "وقت" }, { word: "WAVE", ar: "موجة" },
            { word: "WORK", ar: "عمل" }, { word: "ZOOM", ar: "تكبير" }, { word: "BLUE", ar: "أزرق" },
            { word: "PINK", ar: "وردي" }
        ],
        expert: [
            { word: "FATHER", ar: "أب" }, { word: "MOTHER", ar: "أم" }, { word: "SCHOOL", ar: "مدرسة" },
            { word: "PYTHON", ar: "بايثون" }, { word: "DRAGON", ar: "تنين" }, { word: "SUMMER", ar: "صيف" },
            { word: "WINTER", ar: "شتاء" }, { word: "ANIMAL", ar: "حيوان" }, { word: "DOCTOR", ar: "طبيب" },
            { word: "YELLOW", ar: "أصفر" }, { word: "ORANGE", ar: "برتقالي" }, { word: "FLOWER", ar: "زهرة" },
            { word: "GARDEN", ar: "حديقة" }, { word: "PLANET", ar: "كوكب" }, { word: "SILVER", ar: "فضة" },
            { word: "ROCKET", ar: "صاروخ" }, { word: "CAMERA", ar: "كاميرا" }, { word: "WINDOW", ar: "نافذة" },
            { word: "PENCIL", ar: "قلم رصاص" }, { word: "BANANA", ar: "موز" }, { word: "BOTTLE", ar: "زجاجة" },
            { word: "BRIDGE", ar: "جسر" }, { word: "CASTLE", ar: "قلعة" }, { word: "CIRCLE", ar: "دائرة" },
            { word: "DANGER", ar: "خطر" }, { word: "ENERGY", ar: "طاقة" }, { word: "FOREST", ar: "غابة" },
            { word: "FUTURE", ar: "مستقبل" }, { word: "ISLAND", ar: "جزيرة" }, { word: "MARKET", ar: "سوق" },
            { word: "MEMORY", ar: "ذاكرة" }, { word: "NUMBER", ar: "رقم" }, { word: "PERSON", ar: "شخص" }, { word: "RIVER", ar: "نهر" }, { word: "SYSTEM", ar: "نظام" }, { word: "TRAVEL", ar: "سفر" }, { word: "VALLEY", ar: "وادي" }, { word: "WONDER", ar: "عجب" }, { word: "MOHAMMED", ar: "محمد" }, { word: "AHMED", ar: "أحمد" }
        ]
    };

    let currentLevel = 'kids';
    let currentWordObj = {};
    let currentWord = '';
    let currentCipher = '';
    let score = 0;

    // دالة التشفير الرقمي
    function encodeWord(word) {
        return word.toUpperCase().split('').map(char => letterGroups[char] || '?').join(' + ');
    }

    // إعداد جولة جديدة
    function nextRound() {
        const bank = wordBank[currentLevel];
        currentWordObj = bank[Math.floor(Math.random() * bank.length)];
        currentWord = currentWordObj.word;
        currentCipher = encodeWord(currentWord);
        
        document.getElementById('cipherText').innerText = currentCipher;
        document.getElementById('userInput').value = '';
        document.getElementById('feedback').innerText = '';
        document.getElementById('translationBox').style.display = 'none';
        document.getElementById('listenBtn').style.display = 'none';

        // إظهار تلميح عدد الأحرف
        const len = currentWord.length;
        document.getElementById('letterCountHint').innerText = `الكلمة تتكون من: ${len} أحرف`;
    }

    // نطق الكلمة بالإنجليزية باستخدام Web Speech API
    function speakWord(text) {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.85; // سرعة متوسطة وواضحة
            window.speechSynthesis.speak(utterance);
        }
    }

    // التحقق من الإجابة
    function checkAnswer() {
        const userAns = document.getElementById('userInput').value.trim().toUpperCase();
        const feedback = document.getElementById('feedback');
        const translationBox = document.getElementById('translationBox');
        const listenBtn = document.getElementById('listenBtn');

        if (!userAns) return;

        if (userAns === currentWord || encodeWord(userAns) === currentCipher) {
            feedback.style.color = 'var(--success)';
            feedback.innerText = `✨ إجابة صحيحة! (${currentWord})`;
            
            // إظهار الترجمة والنطق
            translationBox.innerText = `الترجمة: ${currentWordObj.ar}`;
            translationBox.style.display = 'block';
            listenBtn.style.display = 'flex';

            // نطق الكلمة تلقائياً عند الإجابة الصحيحة
            speakWord(currentWord);

            score += 10;
            document.getElementById('score').innerText = score;
            setTimeout(nextRound, 3000); // إعطاء 3 ثوان لسماع النطق وقراءة الترجمة
        } else {
            feedback.style.color = '#ef4444';
            feedback.innerText = '❌ إجابة خاطئة، تأكد من عدد الأحرف ومجموعات الحروف!';
        }
    }

    // تغيير المستوى
    function setLevel(level) {
        currentLevel = level;
        document.querySelectorAll('.level-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        const labels = { kids: 'أطفال', medium: 'ناشئة', expert: 'محترفون' };
        document.getElementById('levelLabel').innerText = `المستوى: ${labels[level]}`;

        const board = document.getElementById('referenceBoard');
        if (level === 'expert') {
            board.style.opacity = '0.3';
        } else {
            board.style.opacity = '1';
        }

        nextRound();
    }

    // أداة التشفير أثناء الكتابة
    function encodeCustomWord() {
        const input = document.getElementById('encoderInput').value.trim();
        const resultDiv = document.getElementById('encoderResult');
        if (input) {
            resultDiv.innerText = encodeWord(input);
        } else {
            resultDiv.innerText = '---';
        }
    }

    // تشغيل الجولة الأولى
    nextRound();
</script>

</body>
</html>
