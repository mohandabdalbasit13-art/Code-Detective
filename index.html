<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُحقّق الشفرات - Code Detective</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --accent: #f59e0b;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative; /* needed for confetti positioning */
            overflow: visible;
        }

        header {
            text-align: center;
        }

        header h1 {
            color: var(--primary);
            font-size: 1.8rem;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* متحركة: أيقونة العنوان */
        .logo {
            display: inline-block;
            font-size: 1.6rem;
            transform-origin: center;
            animation: logo-bounce 2000ms ease-in-out infinite;
        }
        @keyframes logo-bounce {
            0% { transform: translateY(0) rotate(0deg); }
            45% { transform: translateY(-6px) rotate(-8deg); }
            55% { transform: translateY(-4px) rotate(6deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }

        header p {
            font-size: 0.9rem;
            color: #6b7280;
        }

        /* المجموعات المرجعية */
        .reference-board {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
            gap: 8px;
            background: #eef2ff;
            padding: 12px;
            border-radius: 12px;
        }

        .group-card {
            background: white;
            padding: 8px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #c7d2fe;
        }

        .group-num {
            font-weight: bold;
            color: var(--primary);
            font-size: 0.9rem;
        }

        .group-letters {
            font-size: 0.8rem;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* اختيار المستوى */
        .level-selector {
            display: flex;
            background: #f3f4f6;
            padding: 4px;
            border-radius: 10px;
        }

        .level-btn {
            flex: 1;
            padding: 8px 0;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 8px;
            font-weight: bold;
            color: #6b7280;
            transition: 0.3s;
        }

        .level-btn.active {
            background: white;
            color: var(--primary);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* منطقة اللعبة */
        .game-card {
            border: 2px dashed #e5e7eb;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-weight: bold;
            color: var(--accent);
        }

        .cipher-display {
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 3px;
            color: var(--primary);
            margin: 15px 0;
            direction: ltr;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 1.1rem;
            text-align: center;
            direction: ltr;
            text-transform: uppercase;
            outline: none;
            transition: 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .feedback {
            margin-top: 10px;
            font-weight: bold;
            min-height: 24px;
        }

        /* قسم أداة التشفير التفاعلية */
        .encoder-section {
            background: #f9fafb;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
        }

        .encoder-section h3 {
            font-size: 1rem;
            margin-bottom: 10px;
        }

        .encoded-result {
            margin-top: 10px;
            font-weight: bold;
            color: var(--success);
            direction: ltr;
            text-align: center;
            font-size: 1.2rem;
        }

        /* تأثير النجوم عند النجاح */
        .stars {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 10%;
            pointer-events: none;
            display: flex;
            gap: 6px;
            z-index: 30;
            font-size: 1.4rem;
            opacity: 0;
            animation: stars-pop 900ms ease-out forwards;
        }
        @keyframes stars-pop {
            0% { transform: translateX(-50%) scale(0.2); opacity: 0; }
            50% { transform: translateX(-50%) scale(1.1); opacity: 1; }
            100% { transform: translateX(-50%) scale(1) opacity: 0; }
        }

        /* كونفيتي */
        #confetti {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: visible;
            z-index: 25;
        }
        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 14px;
            opacity: 0.95;
            transform-origin: center;
            border-radius: 2px;
            will-change: transform, top, left;
            animation: confetti-fall linear forwards, confetti-tilt linear infinite;
        }
        @keyframes confetti-fall {
            from { transform: translateY(-20vh) rotate(0deg); opacity: 1; }
            to { transform: translateY(120vh) rotate(720deg); opacity: 0.95; }
        }
        @keyframes confetti-tilt {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(180deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="app-container" aria-live="polite">
    <header>
        <h1><span class="logo" aria-hidden="true">🔍</span> Code Detective</h1>
        <p>فك الشفرة، تعلم الحروف والكلمات الإنجليزية</p>
    </header>

    <!-- مكان كونفيتي -->
    <div id="confetti" aria-hidden="true"></div>

    <!-- نجوم نجاح (ستظهر عند الإجابة الصحيحة) -->
    <div id="starsContainer" class="stars" aria-hidden="true">✨ ✨ ✨</div>

    <!-- لوحة المجموعات المرجعية -->
    <div class="reference-board" id="referenceBoard" aria-hidden="false">
        <div class="group-card"><div class="group-num">1</div><div class="group-letters">A B C D</div></div>
        <div class="group-card"><div class="group-num">2</div><div class="group-letters">E F G H</div></div>
        <div class="group-card"><div class="group-num">3</div><div class="group-letters">I J K L</div></div>
        <div class="group-card"><div class="group-num">4</div><div class="group-letters">M N O P</div></div>
        <div class="group-card"><div class="group-num">5</div><div class="group-letters">Q R S T</div></div>
        <div class="group-card"><div class="group-num">6</div><div class="group-letters">U V W X</div></div>
        <div class="group-card"><div class="group-num">7</div><div class="group-letters">Y Z</div></div>
    </div>

    <!-- اختيار المستوى -->
    <div class="level-selector" role="tablist" aria-label="اختيار المستوى">
        <button class="level-btn active" onclick="setLevel('kids', this)" aria-pressed="true">أطفال 👶</button>
        <button class="level-btn" onclick="setLevel('medium', this)" aria-pressed="false">ناشئة 👦</button>
        <button class="level-btn" onclick="setLevel('expert', this)" aria-pressed="false">محترفون 🧠</button>
    </div>

    <!-- منطقة اللعب -->
    <div class="game-card" role="application" aria-labelledby="gameTitle">
        <div class="score-board">
            <span>النقاط: <span id="score">0</span></span>
            <span id="levelLabel">المستوى: أطفال</span>
        </div>
        <p id="gameTitle">خمن الكلمة المكتوبة بالشفرة:</p>
        <div class="cipher-display" id="cipherText" aria-live="polite">---</div>
        <input type="text" id="userInput" placeholder="اكتب الكلمة هنا..." autocomplete="off" aria-label="إجابة اللاعب">
        <button class="btn" onclick="checkAnswer()" id="checkBtn" aria-label="تحقق من الإجابة">تحقق من الإجابة</button>
        <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
    </div>

    <!-- أداة تشفير اسم أو كلمة من اختياراتك -->
    <div class="encoder-section">
        <h3>⚡ أداة التشفير السريع:</h3>
        <input type="text" id="encoderInput" placeholder="اكتب أي اسم أو كلمة..." oninput="encodeCustomWord()" aria-label="أداة التشفير">
        <div class="encoded-result" id="encoderResult">---</div>
    </div>
</div>

<script>
    // توزيع الحروف المرجعية
    const letterGroups = {
        'A':1, 'B':1, 'C':1, 'D':1,
        'E':2, 'F':2, 'G':2, 'H':2,
        'I':3, 'J':3, 'K':3, 'L':3,
        'M':4, 'N':4, 'O':4, 'P':4,
        'Q':5, 'R':5, 'S':5, 'T':5,
        'U':6, 'V':6, 'W':6, 'X':6,
        'Y':7, 'Z':7
    };

    // بنك الكلمات حسب المستويات
    const wordBank = {
        kids: ["CAT", "DOG", "BOY", "BED", "MAN", "PEN"],
        medium: ["LION", "MILK", "FISH", "HAND", "BOOK", "AHMED"],
        expert: ["FATHER", "SCHOOL", "PYTHON", "DRAGON", "MOHAMMED"]
    };

    let currentLevel = 'kids';
    let currentWord = '';
    let currentCipher = '';
    let score = 0;

    // دالة تحويل أي كلمة لشفرة رقمية
    function encodeWord(word) {
        if (!word) return '';
        const words = word.toUpperCase().split(/\s+/);
        const encodedWords = words.map(w => {
            const letters = w.split('').map(char => {
                if (letterGroups[char]) return letterGroups[char];
                return '?';
            });
            return letters.join(' + ');
        });
        return encodedWords.join(' / ');
    }

    // إعداد جولة جديدة
    function nextRound() {
        const words = wordBank[currentLevel];
        currentWord = words[Math.floor(Math.random() * words.length)];
        currentCipher = encodeWord(currentWord);

        document.getElementById('cipherText').innerText = currentCipher || '---';
        document.getElementById('userInput').value = '';
        document.getElementById('feedback').innerText = '';
        document.getElementById('userInput').focus();
    }

    // تفعيل كونفيتي: ينشئ قطعاً مؤقتة ويزيّلها بعد انتهاء الحركة
    function triggerConfetti(count = 28) {
        const confettiRoot = document.getElementById('confetti');
        const colors = ['#f43f5e', '#fb923c', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6'];
        const width = document.querySelector('.app-container').clientWidth;

        for (let i = 0; i < count; i++) {
            const el = document.createElement('div');
            el.className = 'confetti-piece';
            const w = 8 + Math.random() * 8; // width
            const h = 10 + Math.random() * 10;
            el.style.width = `${w}px`;
            el.style.height = `${h}px`;
            el.style.background = colors[Math.floor(Math.random() * colors.length)];
            // random horizontal start within container
            const left = Math.random() * (width - 20);
            el.style.left = `${left}px`;
            // random animation duration & delay
            const dur = 1200 + Math.random() * 900;
            const delay = Math.random() * 200;
            el.style.animationDuration = `${dur}ms, ${800 + Math.random() * 600}ms`;
            el.style.animationDelay = `${delay}ms, ${delay}ms`;
            // slight rotation origin offset
            el.style.transform = `translateY(-10vh) rotate(${Math.random() * 360}deg)`;
            confettiRoot.appendChild(el);

            // remove after animation
            (function(node, duration) {
                setTimeout(() => {
                    if (node && node.parentNode) node.parentNode.removeChild(node);
                }, duration + 600);
            })(el, dur + delay);
        }
    }

    // إظهار نجوم متوهجة قصيرة
    function showStars() {
        const stars = document.getElementById('starsContainer');
        stars.style.opacity = '0';
        stars.setAttribute('aria-hidden', 'false');
        // re-trigger animation by cloning
        const clone = stars.cloneNode(true);
        stars.parentNode.replaceChild(clone, stars);
        clone.classList.add('stars');
        clone.setAttribute('aria-hidden', 'false');
        // إخفاء بعد مدة
        setTimeout(() => {
            clone.setAttribute('aria-hidden', 'true');
            clone.style.opacity = '0';
        }, 900);
    }

    // التحقق من إجابة اللاعب
    function checkAnswer() {
        const userAns = document.getElementById('userInput').value.trim().toUpperCase();
        const feedback = document.getElementById('feedback');

        if (!userAns) return;

        if (userAns === currentWord || encodeWord(userAns) === currentCipher) {
            feedback.style.color = 'var(--success)';
            feedback.innerText = '✨ إجابة صحيحة! أحسنت.';
            score += 10;
            document.getElementById('score').innerText = score;
            // تأثيرات بصرية
            showStars();
            triggerConfetti(30);
            setTimeout(nextRound, 1200);
        } else {
            feedback.style.color = '#ef4444';
            feedback.innerText = '❌ إجابة خاطئة، حاول مرة أخرى!';
        }
    }

    // تغيير المستوى — يستقبل العنصر الذي تم النقر عليه لإدارة فئة active بأمان
    function setLevel(level, btn) {
        currentLevel = level;
        document.querySelectorAll('.level-btn').forEach(b => {
            b.classList.remove('active');
            b.setAttribute('aria-pressed', 'false');
        });
        if (btn && btn.classList) {
            btn.classList.add('active');
            btn.setAttribute('aria-pressed', 'true');
        }

        const labels = { kids: 'أطفال', medium: 'ناشئة', expert: 'محترفون' };
        document.getElementById('levelLabel').innerText = `المستوى: ${labels[level]}`;

        // إخفاء اللوحة المرجعية في مستوى المحترفين للتحدي
        const board = document.getElementById('referenceBoard');
        if (level === 'expert') {
            board.style.opacity = '0.3';
            board.setAttribute('aria-hidden', 'true');
        } else {
            board.style.opacity = '1';
            board.setAttribute('aria-hidden', 'false');
        }

        nextRound();
    }

    // أداة التشفير التفاعلية أثناء الكتابة
    function encodeCustomWord() {
        const input = document.getElementById('encoderInput').value.trim();
        const resultDiv = document.getElementById('encoderResult');
        if (input) {
            resultDiv.innerText = encodeWord(input);
        } else {
            resultDiv.innerText = '---';
        }
    }

    // دعم مفتاح Enter لإرسال الإجابة
    document.getElementById('userInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            checkAnswer();
        }
    });

    // بدء اللعبة لأول مرة
    nextRound();
</script>

</body>
</html>
